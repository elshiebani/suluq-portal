<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - المعهد العالي للعلوم والتقنية سلوق</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 8px; border: 1px solid #dcdfe6; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .institute-logo { max-width: 110px; height: auto; }
    .header-title { color: #1a365d; font-weight: 700; }
    .btn-primary { background-color: #1a365d; border-color: #1a365d; }
    .btn-primary:hover { background-color: #0f233d; border-color: #0f233d; }
  </style>
</head>
<body class="py-5">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- 1. شاشة تسجيل الدخول -->
      <div id="loginCard" class="card p-4">
        <div class="text-center mb-4">
          <img src="logo.png" alt="شعار المعهد العالي للعلوم والتقنية سلوق" class="institute-logo mb-3">
          <h5 class="header-title mb-1">المعهد العالي للعلوم والتقنية - سلوق</h5>
          <p class="text-muted small mb-0">تسجيل الدخول إلى لوحة الإدارة</p>
        </div>

        <hr class="mb-4">

        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">اسم المستخدم:</label>
          <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">كلمة المرور:</label>
          <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور">
        </div>

        <button class="btn btn-primary w-100 fw-semibold py-2 mt-2" onclick="login()">تسجيل الدخول</button>

        <div id="loginAlert" class="mt-3"></div>
      </div>

      <!-- 2. لوحة التحكم (مخفية حتى يتم الدخول بنجاح) -->
      <div id="adminPanel" class="card p-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <img src="logo.png" alt="شعار المعهد" style="max-width: 50px;">
            <h6 class="header-title mb-0">لوحة إدارة قرارات القبول</h6>
          </div>
          <button class="btn btn-outline-danger btn-sm" onclick="logout()">تسجيل الخروج</button>
        </div>

        <hr class="mb-4">

        <div class="mb-3">
          <label for="nationalId" class="form-label fw-semibold">الرقم الوطني للطالب:</label>
          <input type="text" id="nationalId" class="form-control" placeholder="أدخل الرقم الوطني">
        </div>

        <div class="mb-3">
          <label for="statusSelect" class="form-label fw-semibold">قرار حالة الطلب:</label>
          <select id="statusSelect" class="form-select" onchange="toggleReasonBox()">
            <option value="approved">مقبول</option>
            <option value="needs_fix">إجراءات ناقصة</option>
            <option value="rejected">مرفوض</option>
          </select>
        </div>

        <!-- خانة سبب الرفض/الإجراءات الناقصة -->
        <div class="mb-3" id="reasonBox" style="display: none;">
          <label for="rejectionReason" class="form-label fw-semibold text-danger">سبب والتفاصيل:</label>
          <textarea id="rejectionReason" class="form-control" rows="3" placeholder="اكتب سبب الرفض أو المستندات الناقصة..."></textarea>
        </div>

        <button class="btn btn-primary w-100 fw-semibold py-2 mt-2" onclick="saveDecision()">حفظ القرار الرسمي</button>

        <div id="alertBox" class="mt-3"></div>
      </div>

    </div>
  </div>
</div>

<script>
  // بيانات الاتصال بـ Supabase
  const SUPABASE_URL = 'https://islfpajoqjdjyqfmytjx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_LuY9qIRrZBGki6nS0i8TNQ_rlpPrlJC';

  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // التحقق من حالة الدخول السابقة عند فتح الصفحة
  window.onload = function() {
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      showAdminPanel();
    }
  };

  // وظيفة تسجيل الدخول
  function login() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const loginAlert = document.getElementById('loginAlert');

    if (user === 'noura' && pass === '2241997') {
      sessionStorage.setItem('isLoggedIn', 'true');
      showAdminPanel();
    } else {
      loginAlert.innerHTML = '<div class="alert alert-danger text-center small">اسم المستخدم أو كلمة المرور غير صحيحة!</div>';
    }
  }

  // عرض لوحة الإدارة
  function showAdminPanel() {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
  }

  // وظيفة تسجيل الخروج
  function logout() {
    sessionStorage.removeItem('isLoggedIn');
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('loginAlert').innerHTML = '';
  }

  // إظهار وإخفاء صندوق الأسباب
  function toggleReasonBox() {
    const status = document.getElementById('statusSelect').value;
    const reasonBox = document.getElementById('reasonBox');
    reasonBox.style.display = (status === 'rejected' || status === 'needs_fix') ? 'block' : 'none';
  }

  // حفظ القرار في Supabase
  async function saveDecision() {
    const nationalId = document.getElementById('nationalId').value.trim();
    const status = document.getElementById('statusSelect').value;
    const reason = document.getElementById('rejectionReason').value.trim();
    const alertBox = document.getElementById('alertBox');

    if (!nationalId) {
      alertBox.innerHTML = '<div class="alert alert-warning text-center small">يرجى إدخال الرقم الوطني.</div>';
      return;
    }

    if ((status === 'rejected' || status === 'needs_fix') && !reason) {
      alertBox.innerHTML = '<div class="alert alert-danger text-center small">يرجى كتابة سبب التفصيل.</div>';
      return;
    }

    alertBox.innerHTML = '<div class="alert alert-info text-center small">جاري حفظ القرار...</div>';

    const finalReason = (status === 'approved') ? 'تم اعتماد القبول بنجاح.' : reason;

    try {
      const { data: existing, error: selectError } = await _supabase
        .from('students')
        .select('id')
        .eq('national_id', nationalId);

      if (selectError) throw selectError;

      let error;

      if (existing && existing.length > 0) {
        const res = await _supabase
          .from('students')
          .update({ status: status, rejection_reason: finalReason })
          .eq('national_id', nationalId);
        error = res.error;
      } else {
        const res = await _supabase
          .from('students')
          .insert([{ national_id: nationalId, status: status, rejection_reason: finalReason }]);
        error = res.error;
      }

      if (error) throw error;

      alertBox.innerHTML = '<div class="alert alert-success text-center small">تم حفظ القرار الرسمي بنجاح.</div>';
      document.getElementById('nationalId').value = '';
      document.getElementById('rejectionReason').value = '';
      toggleReasonBox();

    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-danger text-center small">حدث خطأ: ${err.message || 'تعذر الاتصال بالسيرفر'}</div>`;
    }
  }
</script>

</body>
</html>
