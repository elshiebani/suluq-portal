<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - تجديد القيد - المعهد العالي للعلوم والتقنية سلوق</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 8px; border: 1px solid #dcdfe6; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .institute-logo { max-width: 110px; height: auto; }
    .header-title { color: #1a365d; font-weight: 700; }
    .btn-primary { background-color: #1a365d; border-color: #1a365d; }
    .btn-primary:hover { background-color: #0f233d; border-color: #0f233d; }
  </style>
</head>
<body class="py-5">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <!-- Logo and Header -->
        <div class="text-center mb-4">
          <img src="logo.png" alt="شعار المعهد العالي للعلوم والتقنية سلوق" class="institute-logo mb-3">
          <h5 class="header-title mb-1">المعهد العالي للعلوم والتقنية - سلوق</h5>
          <p class="text-muted small mb-0">منظومة إدارة واعتماد قرارات تجديد القيد</p>
        </div>

        <hr class="mb-4">

        <!-- Form -->
        <div class="mb-3">
          <label for="nationalId" class="form-label fw-semibold">الرقم الوطني للطالب:</label>
          <input type="text" id="nationalId" class="form-control" placeholder="أدخل الرقم الوطني">
        </div>

        <div class="mb-3">
          <label for="statusSelect" class="form-label fw-semibold">قرار حالة الطلب:</label>
          <select id="statusSelect" class="form-select" onchange="toggleReasonBox()">
            <option value="approved">مقبول</option>
            <option value="needs_fix">إجراءات ناقصة</option>
            <option value="rejected">مرفوض</option>
          </select>
        </div>

        <div class="mb-3" id="reasonBox" style="display: none;">
          <label for="rejectionReason" class="form-label fw-semibold text-danger">تبرير وسبب الرفض:</label>
          <textarea id="rejectionReason" class="form-control" rows="3" placeholder="اكتب سبب الرفض بالتفصيل..."></textarea>
        </div>

        <button class="btn btn-primary w-100 fw-semibold py-2 mt-2" onclick="saveDecision()">حفظ القرار الرسمي</button>

        <div id="alertBox" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // مفاتيح الاتصال المدمجة بـ Supabase
  const SUPABASE_URL = 'https://islfpajoqjdjyqfmytjx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_LuY9qIRrZBGki6nS0i8TNQ_rlpPrlJC';

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function toggleReasonBox() {
    const status = document.getElementById('statusSelect').value;
    const reasonBox = document.getElementById('reasonBox');
    reasonBox.style.display = (status === 'rejected') ? 'block' : 'none';
  }

  async function saveDecision() {
    const nationalId = document.getElementById('nationalId').value.trim();
    const status = document.getElementById('statusSelect').value;
    const reason = document.getElementById('rejectionReason').value.trim();
    const alertBox = document.getElementById('alertBox');

    if (!nationalId) {
      alertBox.innerHTML = '<div class="alert alert-warning text-center small">يرجى إدخال الرقم الوطني.</div>';
      return;
    }

    if (status === 'rejected' && !reason) {
      alertBox.innerHTML = '<div class="alert alert-danger text-center small">يرجى إدخال سبب وتبرير الرفض.</div>';
      return;
    }

    alertBox.innerHTML = '<div class="alert alert-info text-center small">جاري حفظ القرار...</div>';

    const finalReason = status === 'rejected' ? reason : (status === 'needs_fix' ? 'توجه إلى قسم الدراسة والامتحانات لاستكمال المستندات الناقصة.' : 'تم قبول الطلب وتجديد القيد بنجاح.');

    const { data: existing } = await supabase
      .from('students')
      .select('id')
      .eq('national_id', nationalId);

    let error;

    if (existing && existing.length > 0) {
      const res = await supabase
        .from('students')
        .update({ status: status, rejection_reason: finalReason })
        .eq('national_id', nationalId);
      error = res.error;
    } else {
      const res = await supabase
        .from('students')
        .insert([{ national_id: nationalId, status: status, rejection_reason: finalReason }]);
      error = res.error;
    }

    if (error) {
      alertBox.innerHTML = `<div class="alert alert-danger text-center small">حدث خطأ: ${error.message}</div>`;
    } else {
      alertBox.innerHTML = '<div class="alert alert-success text-center small">تم اعتماد القرار وحفظه بنجاح.</div>';
      document.getElementById('nationalId').value = '';
      document.getElementById('rejectionReason').value = '';
      toggleReasonBox();
    }
  }
</script>

</body>
</html>
